[package]
name = "tz4-threshold"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Threshold tz4 accounts on Tezos without a trusted dealer: a DKG for native multisig, threshold BLS signing and the proof of possession"
publish = false

[dependencies]
# The DKG is frost-core's (Zcash Foundation, audited), run over BLS12-381 G1.
frost-core = "3.0.0"
bls12_381 = { version = "0.8.0", features = ["experimental"] }
ff = "0.13"
group = "0.13"
# bls12_381 0.8's expand_message_xmd takes a digest 0.9 hash.
sha2 = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
blake2 = "0.10"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
